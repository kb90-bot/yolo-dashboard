name: YOLO Telegram Setup Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: read

jobs:
  telegram-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test upstream opportunity filters
        run: python -m unittest discover -s tests -p "test_setup_digest.py" -v

      - name: Fetch upstream dashboard state, filter and send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/build_telegram_digest.py
