
name: Telegram Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

jobs:
  telegram-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch complete YOLO data and send readable Telegram digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import tempfile
          from pathlib import Path

          BASE = (
              "https://raw.githubusercontent.com/"
              "DocYolo77/yolo-dashboard/main/data/"
          )

          FILES = [
              "screeners.json",
              "dashboard_state.json",
              "narratives.json",
              "narratives_map.json",
              "narrative_universe_state.json",
              "snapshot.json",
          ]

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]
          API = f"https://api.telegram.org/bot{TOKEN}/"

          def api_call(method, fields, file_path=None):
              boundary = "----YOLOTelegramBoundary"
              body = bytearray()

              for key, value in fields.items():
                  body.extend(f"--{boundary}\r\n".encode())
                  body.extend(
                      f'Content-Disposition: form-data; name="{key}"\r\n\r\n'.encode()
                  )
                  body.extend(str(value).encode("utf-8"))
                  body.extend(b"\r\n")

              if file_path:
                  path = Path(file_path)
                  body.extend(f"--{boundary}\r\n".encode())
                  body.extend(
                      (
                          'Content-Disposition: form-data; '
                          f'name="document"; filename="{path.name}"\r\n'
                      ).encode()
                  )
                  body.extend(b"Content-Type: application/json\r\n\r\n")
                  body.extend(path.read_bytes())
                  body.extend(b"\r\n")

              body.extend(f"--{boundary}--\r\n".encode())

              request = urllib.request.Request(
                  API + method,
                  data=bytes(body),
                  headers={
                      "Content-Type": f"multipart/form-data; boundary={boundary}"
                  },
                  method="POST",
              )

              with urllib.request.urlopen(request, timeout=90) as response:
                  result = json.loads(response.read().decode("utf-8"))

              if not result.get("ok"):
                  raise RuntimeError(f"Telegram API error: {result}")

              return result

          def fetch_json(name, directory):
              request = urllib.request.Request(
                  BASE + name,
                  headers={"User-Agent": "YOLO-Telegram-Digest"},
              )

              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()

              path = Path(directory) / name
              path.write_bytes(raw)
              data = json.loads(raw.decode("utf-8"))

              print(f"Downloaded {name}: {len(raw)} bytes")
              return data, path

          def send_long_message(text):
              limit = 3500
              chunks = []

              while len(text) > limit:
                  cut = text.rfind("\n", 0, limit)
                  if cut < 1:
                      cut = limit
                  chunks.append(text[:cut])
                  text = text[cut:].lstrip("\n")

              if text:
                  chunks.append(text)

              total = len(chunks)
              for index, chunk in enumerate(chunks, 1):
                  api_call(
                      "sendMessage",
                      {
                          "chat_id": CHAT_ID,
                          "text": f"Teil {index}/{total}\n\n{chunk}",
                      },
                  )

          def fmt(value):
              if value is None:
                  return "-"
              if isinstance(value, float):
                  return f"{value:.2f}".rstrip("0").rstrip(".")
              return str(value)

          with tempfile.TemporaryDirectory() as temp:
              downloaded = {}
              paths = {}

              for name in FILES:
                  data, path = fetch_json(name, temp)
                  downloaded[name] = data
                  paths[name] = path

              screener_data = downloaded["screeners.json"]
              dashboard = downloaded["dashboard_state.json"]
              meta = screener_data.get("meta", {})
              dashboard_meta = dashboard.get("meta", {})
              screeners = screener_data.get("screeners", {})

              lines = [
                  "YOLO DASHBOARD – VOLLSTÄNDIGER DIGEST",
                  f"Screener-Datenstand: {meta.get('as_of_date', 'unbekannt')}",
                  f"Dashboard-Datenstand: {dashboard_meta.get('as_of_date', 'unbekannt')}",
                  f"Eligible Universe: {meta.get('eligible_universe_size', 'unbekannt')}",
                  "",
              ]

              # Alle Treffer aller veröffentlichten Screener.
              for key, screener in screeners.items():
                  tickers = screener.get("tickers", [])
                  lines.extend([
                      "",
                      "=" * 28,
                      f"{screener.get('name', key)} – {len(tickers)} Treffer",
                      "=" * 28,
                      "",
                  ])

                  for stock in tickers:
                      symbol = stock.get("symbol", "?")
                      lines.extend([
                          f"--- {symbol} | Kurs {fmt(stock.get('close'))} ---",
                          (
                              f"Relative Stärke: 1W {fmt(stock.get('rs_percentile_1w'))} | "
                              f"1M {fmt(stock.get('rs_percentile_1m'))} | "
                              f"3M {fmt(stock.get('rs_percentile_3m'))} | "
                              f"6M {fmt(stock.get('rs_percentile_6m'))}"
                          ),
                          f"Structural RS: {fmt(stock.get('structural_rs'))}",
                          (
                              f"SMA50 {fmt(stock.get('sma50_distance_pct'))}% | "
                              f"SMA200 {fmt(stock.get('sma200_distance_pct'))}%"
                          ),
                          (
                              f"EMA10 {fmt(stock.get('ema10_distance_pct'))}% | "
                              f"EMA20 {fmt(stock.get('ema20_distance_pct'))}%"
                          ),
                          (
                              f"Tag {fmt(stock.get('d1_pct'))}% | "
                              f"MTD {fmt(stock.get('mtd_pct'))}% | "
                              f"YTD {fmt(stock.get('ytd_pct'))}%"
                          ),
                          (
                              f"RVOL {fmt(stock.get('rvol_50'))} | "
                              f"ATR-Extension {fmt(stock.get('atr_extension'))} | "
                              f"Thrust RS {fmt(stock.get('stock_thrust_rs'))}"
                          ),
                          f"ADR20 {fmt(stock.get('adr20'))}% | Volumen {fmt(stock.get('volume'))}",
                          f"Market Cap {fmt(stock.get('market_cap'))}",
                          "",
                      ])

              # Dashboard: Originaldaten werden zusätzlich vollständig angehängt.
              lines.extend([
                  "",
                  "=" * 28,
                  "OPPORTUNITY ENGINE – ÜBERSICHT",
                  "=" * 28,
                  "",
              ])

              # Dashboard-State kann je nach Originalversion unterschiedlich aufgebaut sein.
              # Deshalb verlassen wir uns für die vollständigen Felder zusätzlich auf den JSON-Anhang.
              for key in ("market_regime", "qqq_health", "opportunities"):
                  if key in dashboard:
                      lines.append(f"{key}:")
                      lines.append(json.dumps(
                          dashboard[key],
                          ensure_ascii=False,
                          indent=2,
                      ))
                      lines.append("")

              send_long_message("\n".join(lines))

              # Vollständige JSON-Originaldateien als Anhänge.
              for name in FILES:
                  api_call(
                      "sendDocument",
                      {
                          "chat_id": CHAT_ID,
                          "caption": f"YOLO Originaldaten: {name}",
                      },
                      paths[name],
                  )
                  print(f"Sent document: {name}")

              print("Vollständiger, formatierter Digest erfolgreich gesendet.")
          PY
