name: YOLO Telegram Dashboard Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: read

jobs:
  telegram-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore optimization rank history
        uses: actions/cache/restore@v4
        with:
          path: .cache/optimization_history.json
          key: optimization-history-${{ github.run_id }}
          restore-keys: |
            optimization-history-

      - name: Build leaderboards without sending a separate message
        continue-on-error: true
        run: |
          python scripts/build_optimization_leaders.py \\
            --history .cache/optimization_history.json \\
            --output data/optimization_leaders.json \\
            --message-output data/optimization_leaders_message.txt \\
            --no-send

      - name: Build and send dashboard digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import date, datetime, timedelta, timezone

          BASE = "https://raw.githubusercontent.com/DocYolo77/yolo-dashboard/main/data/"
          MAX_AGE_DAYS = 7
          MAX_MESSAGE_LENGTH = 3800

          def fail(message):
              print(f"ERROR: {message}", file=sys.stderr)
              raise SystemExit(1)

          def fetch_json(filename):
              request = urllib.request.Request(
                  BASE + filename,
                  headers={"User-Agent": "YOLO-Telegram-Digest"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.loads(response.read().decode("utf-8"))
              except (
                  urllib.error.URLError,
                  TimeoutError,
                  UnicodeDecodeError,
                  json.JSONDecodeError
              ) as exc:
                  fail(f"Could not load {filename}: {exc}")

              if not isinstance(data, dict):
                  fail(f"{filename}: expected a JSON object")
              return data

          def isnum(value):
              return (
                  isinstance(value, (int, float))
                  and not isinstance(value, bool)
                  and math.isfinite(value)
              )

          def fmt(value, digits=1):
              return f"{value:.{digits}f}" if isnum(value) else "n/a"

          def get_date(data, filename):
              meta = data.get("meta") or {}

              # narratives.json uses meta.updated_at instead of meta.as_of_date.
              raw = meta.get("as_of_date")
              if not raw and filename == "narratives.json":
                  raw = meta.get("updated_at")

              # Both YYYY-MM-DD and ISO timestamps are accepted.
              if isinstance(raw, str):
                  raw = raw[:10]

              try:
                  result = date.fromisoformat(raw)
              except (TypeError, ValueError):
                  fail(
                      f"{filename}: missing or invalid "
                      "meta.as_of_date / meta.updated_at"
                  )

              today = datetime.now(timezone.utc).date()
              if result > today or (today - result).days > MAX_AGE_DAYS:
                  fail(f"{filename}: data is stale or future-dated ({result})")
              return result

          def send_telegram(message):
              token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
              chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

              if not token or not chat_id:
                  fail("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret")

              payload = json.dumps({
                  "chat_id": chat_id,
                  "text": message,
                  "disable_web_page_preview": True
              }).encode("utf-8")

              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.loads(response.read().decode("utf-8"))
              except (
                  urllib.error.URLError,
                  TimeoutError,
                  json.JSONDecodeError
              ) as exc:
                  fail(f"Telegram request failed: {exc}")

              if not result.get("ok"):
                  fail(f"Telegram API error: {result}")

          def send_chunks(lines):
              chunk = ""
              for line in lines:
                  candidate = line if not chunk else chunk + "\n" + line
                  if len(candidate) > MAX_MESSAGE_LENGTH and chunk:
                      send_telegram(chunk)
                      chunk = line
                  else:
                      chunk = candidate
              if chunk.strip():
                  send_telegram(chunk)

          # Load all three data sources.
          dashboard = fetch_json("dashboard_state.json")
          narrative_data = fetch_json("narratives.json")
          screener_data = fetch_json("screeners.json")

          dashboard_date = get_date(dashboard, "dashboard_state.json")
          narrative_date = get_date(narrative_data, "narratives.json")
          screener_date = get_date(screener_data, "screeners.json")

          if len({dashboard_date, narrative_date, screener_date}) != 1:
              fail(
                  "Snapshot dates do not match: "
                  f"dashboard={dashboard_date}, "
                  f"narratives={narrative_date}, "
                  f"screeners={screener_date}"
              )

          lines = [
              "YOLO — MOMENTUM DASHBOARD",
              f"Datenstand: {dashboard_date.isoformat()}",
              "",
              "1. WAS HAT SICH VERÄNDERT?"
          ]

          # Change events from dashboard_state.json.
          changes = dashboard.get("what_changed") or {}
          events = changes.get("events") or []

          if isinstance(events, list) and events:
              for event in events[:30]:
                  if isinstance(event, str):
                      description = event
                  elif isinstance(event, dict):
                      description = next(
                          (
                              event.get(key)
                              for key in (
                                  "message", "description", "label",
                                  "title", "summary"
                              )
                              if isinstance(event.get(key), str)
                              and event.get(key).strip()
                          ),
                          None
                      )

                      if not description:
                          category = str(
                              event.get("type")
                              or event.get("category")
                              or "Änderung"
                          )
                          subject = str(
                              event.get("name")
                              or event.get("symbol")
                              or event.get("narrative")
                              or ""
                          )
                          detail = str(
                              event.get("detail")
                              or event.get("change")
                              or ""
                          )
                          description = " — ".join(
                              part for part in (category, subject, detail)
                              if part
                          )
                  else:
                      continue

                  lines.append("• " + description[:300])
          elif changes.get("first_run"):
              lines.append("• Erster Lauf: noch kein Vergleich verfügbar.")
          else:
              lines.append("• Keine Änderungen im Datenfeed gemeldet.")

          # Market regime: recommendation only, not the full dashboard.
          regime = dashboard.get("market_regime") or {}
          regime_state = str(
              regime.get("state") or "UNKNOWN"
          ).upper().replace("_", " ")

          recommendations = {
              "STRONG OFFENSIVE":
                  "Erhöhtes Risiko; Add-ons und mehrere neue Positionen erlaubt.",
              "OFFENSIVE":
                  "Je nach bisheriger Traktion neues Risiko und weitere Positionen erlaubt.",
              "SELECTIVE":
                  "Bei positivem Feedback Exposition langsam erhöhen; normales bis reduziertes Risiko.",
              "DEFENSIVE":
                  "Risiko reduzieren, selektiv handeln und nur bei positivem Feedback erhöhen.",
              "RISK OFF":
                  "Cash bevorzugen; falls überhaupt, nur kleine Starter oder Scouts."
          }

          lines += [
              "",
              "2. MOMENTUM MARKET REGIME",
              "Empfehlung: " + recommendations.get(
                  regime_state,
                  "Regime nicht erkannt: Risiko nicht allein anhand dieses Feeds erhöhen."
              )
          ]

          # Top 10 narratives for each native timeframe.
          narratives = narrative_data.get("narratives") or []
          if not isinstance(narratives, list):
              fail("narratives.json: 'narratives' must be a list")

          for label, key in (
              ("1W", "1w"),
              ("1M", "1m"),
              ("3M", "3m"),
              ("6M", "6m")
          ):
              ranked = []

              for narrative in narratives:
                  if not isinstance(narrative, dict):
                      continue

                  rs = narrative.get("narrative_rs") or {}
                  value = rs.get(key) if isinstance(rs, dict) else None
                  name = (
                      narrative.get("name")
                      or narrative.get("label")
                      or narrative.get("id")
                  )

                  if isinstance(name, str) and name.strip() and isnum(value):
                      ranked.append((value, name.strip(), narrative))

              ranked.sort(key=lambda item: item[0], reverse=True)

              lines += ["", f"3. TOP 10 NARRATIVES — {label}"]

              if not ranked:
                  lines.append("Keine gültigen RS-Daten vorhanden.")

              for index, (value, name, narrative) in enumerate(ranked[:10], 1):
                  extra = ""
                  status = narrative.get("status")
                  members = narrative.get("n_members")

                  if isinstance(status, str) and status:
                      extra += f" | {status}"
                  if isnum(members):
                      extra += f" | {int(members)} Titel"

                  lines.append(
                      f"{index}. {name} — RS {fmt(value)}{extra}"
                  )

          # Each strength list uses its matching timeframe metric.
          screener_sections = [
              ("WEEKLY STRENGTH", "weekly_strength", "rs_percentile_1w"),
              ("MONTHLY STRENGTH", "monthly_strength", "rs_percentile_1m"),
              ("3 MONTH STRENGTH", "three_month_strength", "rs_percentile_3m"),
              ("6 MONTH STRENGTH", "six_month_strength", "rs_percentile_6m")
          ]

          screeners = screener_data.get("screeners") or {}

          for title, screener_key, metric in screener_sections:
              lines += ["", f"4. TOP 10 — {title}"]

              screener = (
                  screeners.get(screener_key)
                  if isinstance(screeners, dict)
                  else None
              )
              tickers = (
                  screener.get("tickers", [])
                  if isinstance(screener, dict)
                  else []
              )

              ranked = []
              if isinstance(tickers, list):
                  for ticker in tickers:
                      if not isinstance(ticker, dict):
                          continue

                      symbol = ticker.get("symbol")
                      value = ticker.get(metric)

                      if (
                          isinstance(symbol, str)
                          and symbol.strip()
                          and isnum(value)
                      ):
                          ranked.append(
                              (value, symbol.strip().upper(), ticker)
                          )

              ranked.sort(key=lambda item: item[0], reverse=True)

              if not ranked:
                  lines.append("Keine gültigen Kandidaten im Screener.")

              for index, (value, symbol, ticker) in enumerate(ranked[:10], 1):
                  price = ticker.get("close")
                  price_text = f" | Kurs {fmt(price, 2)}" if isnum(price) else ""
                  lines.append(
                      f"{index}. {symbol} — RS {fmt(value)}{price_text}"
                  )

          lines += ["", "Quelle: DocYolo77/yolo-dashboard"]

          # Append the experimental leaderboards to this same digest workflow.
          # If their source/build is unavailable, the original digest still sends.
          leaderboard_path = "data/optimization_leaders_message.txt"
          if os.path.isfile(leaderboard_path):
              with open(leaderboard_path, encoding="utf-8") as handle:
                  leaderboard_lines = handle.read().splitlines()
              # Drop the helper message title/date/source; the digest already has them.
              lines += ["", "5. MULTI-TIMEFRAME LEADERBOARDS", ""] + leaderboard_lines[4:]

          send_chunks(lines)
          print(f"Telegram digest sent. Snapshot: {dashboard_date}")
          PY

      - name: Save optimization rank history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/optimization_history.json
          key: optimization-history-${{ github.run_id }}
