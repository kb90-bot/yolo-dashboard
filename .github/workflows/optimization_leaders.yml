name: YOLO Optimization Leaders

on:
  workflow_dispatch:
  schedule:
    - cron: "50 23 * * 1-5"

permissions:
  contents: read

jobs:
  optimization-leaders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore optimization rank history
        uses: actions/cache/restore@v4
        with:
          path: .cache/optimization_history.json
          key: optimization-history-${{ github.run_id }}
          restore-keys: |
            optimization-history-

      - name: Build and send additive leaderboards
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/build_optimization_leaders.py \
            --history .cache/optimization_history.json \
            --output data/optimization_leaders.json

      - name: Save optimization rank history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/optimization_history.json
          key: optimization-history-${{ github.run_id }}
