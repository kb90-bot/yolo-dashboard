name: Test Optimization Leaders

on:
  push:
    branches:
      - feature/mtf-leaderboard
  pull_request:
    branches:
      - main
    paths:
      - "scripts/build_optimization_leaders.py"
      - "scripts/build_telegram_digest.py"
      - ".github/workflows/telegram_digest.yml"
      - "tests/test_build_optimization_leaders.py"
      - ".github/workflows/test_optimization_leaders.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Check Python syntax
        run: python -m py_compile scripts/build_optimization_leaders.py scripts/build_telegram_digest.py

      - name: Run optimization leaderboard tests
        run: python -m pytest tests/test_build_optimization_leaders.py -q
